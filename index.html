<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080a">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'">
  <title>ZIR ZIR</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">ZZ</span>
      <span class="brand-name">ZIR ZIR</span>
    </div>
    <button class="icon-btn" id="open-settings" aria-label="Ayarlar">⚙</button>
  </header>

  <main>
    <table class="table" id="leaderboard">
      <thead>
        <tr><th class="c">#</th><th>Oyuncu</th><th class="r">ELO</th><th class="c">G</th><th class="c">M</th><th class="r">%</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="empty" id="empty" hidden>Henüz oyuncu yok. Sağ üstteki ⚙ ayarlardan oyuncu ekle.</p>

    <div class="add-wrap">
      <button class="btn btn-primary btn-add" id="open-match">＋ Maç Ekle</button>
    </div>
  </main>

  <dialog id="modal" class="modal">
    <button class="modal-close" id="modal-close" aria-label="Kapat">✕</button>
    <div id="modal-body"></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="elo.js"></script>
  <script src="app.js"></script>
</body>
</html>
